<!doctype html>
<!--suppress JSUnresolvedReference -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Shop</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@200;500&display=swap');

:root {
    --tg-theme-bg-color: #ffffff;
    --tg-theme-text-color: #000000;
    --tg-theme-button-color: #2481cc;
    --tg-theme-button-text-color: #ffffff;
    --tg-theme-secondary-bg-color: #f4f4f5;
}

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            font-weight: 200;
            color: var(--tg-theme-text-color);
            background: var(--tg-theme-bg-color);
        }

        #main {
            width: 100%;
            padding: 20px;
            text-align: center;
        }

        h1 {
            margin-top: 50px;
            margin-bottom: 10px;
        }

        h2 {
            font-weight: 700;
            font-size: 24px;
            margin-bottom: 20px;
            color: var(--tg-theme-text-color);
        }

        img {
            width: 70px;
            margin: 30px auto;
        }

        p {
            width: 350px;
            margin: 0 auto;
        }

        button {
            border: 2px solid transparent;
            border-radius: 5px;
            margin-top: 50px;
            height: 60px;
            width: 200px;
            font-size: 20px;
            font-weight: 500;
            cursor: pointer;
            transition: all 300ms ease;
            color: var(--tg-theme-button-text-color);
            background: var(--tg-theme-button-color);
        }

        button:hover {
            opacity: 0.85;
            background: transparent;
            color: var(--tg-theme-button-color);
            border-color: var(--tg-theme-button-color);
        }

        #form {
            display: none;
            text-align: center;
            padding-top: 50px;
        }

        input {
            width: 90%;
            outline: none;
            margin: 10px 5%;
            padding: 15px 10px;
            font-size: 14px;
            border: 2px solid silver;
            border-radius: 5px;
        }

        input:focus {
            border-color: #db5d5d;
        }

        .error-msg {
            color: #db5d5d;
            font-size: 14px;
            font-weight: 500;
            text-align: left;
            margin-left: 5%;
            margin-bottom: 2px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="main">
        <h1>Онлайн-магазин</h1>
        <img src="https://cdn-icons-png.flaticon.com/512/3595/3595455.png" alt="Иконка магазина">
        <p>Lorem ipsum dolor sit amet, consectetur elit. Accusantium ipsum magni, molestias.</p>
        <button id="buy">Купить</button>
    </div>
    <form id="form">
        <h2>Оформление покупки</h2>

        <div id="name_error" class="error-msg"></div>
        <input type="text" placeholder="Имя" id="user_name">

        <div id="email_error" class="error-msg"></div>
        <input type="text" placeholder="Электронная почта" id="user_email">

        <div id="phone_error" class="error-msg"></div>
        <input type="text" placeholder="Номер телефона" id="user_phone">

        <button id="order">Оформить</button>
    </form>

    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
    <script>
        let tg = window.Telegram.WebApp;
        let buy = document.getElementById("buy");
        let order = document.getElementById("order");

        buy.addEventListener("click", () => {
            document.getElementById("main").style.display = "none";
            document.getElementById("form").style.display = "block";

            let firstName = tg.initDataUnsafe?.user?.first_name || "";
            let lastName = tg.initDataUnsafe?.user?.last_name || "";

            document.getElementById("user_name").value = `${firstName} ${lastName}`.trim();
        });

        order.addEventListener("click", (event) => {
            event.preventDefault();

            let nameError = document.getElementById("name_error");
            let emailError = document.getElementById("email_error");
            let phoneError = document.getElementById("phone_error");

            nameError.style.display = "none";
            emailError.style.display = "none";
            phoneError.style.display = "none";

            let name = document.getElementById("user_name").value.trim();
            let email = document.getElementById("user_email").value.trim();
            let phone = document.getElementById("user_phone").value.trim();

            let nameRegex = /^[А-Яа-я\s]+$/;
            if (!nameRegex.test(name) || name.length < 2) {
                nameError.textContent = "Введите корректное имя!"
                nameError.style.display = "block";
                return
            }

            let emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                emailError.textContent = "Введите корректную элекнтронную почту!";
                emailError.style.display = "block";
                return
            }

            let phoneRegex = /^[0-9]+$/;
            if (!phoneRegex.test(phone) || phone.length < 7) {
                phoneError.textContent = "Введите корректный номер!"
                phoneError.style.display = "block";
                return
            }

            let data = {
                name: name,
                email: email,
                phone: phone
            }
            tg.send.Data(JSON.stringify(data));
            tg.close();
        });
    </script>

</body>
</html>
